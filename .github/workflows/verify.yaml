name: Maven CI Build

on:
  push:
    branches: [main]
    paths:
      - "**/*.java"
      - "**/*.xml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.java"
      - "**/*.xml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and verify
        run: mvn clean verify

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: target/*.jar
          retention-days: 7
